<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Full Stack Flask + Supabase PostgreSQL CRUD Dashboard">
    <meta name="theme-color" content="#0f172a">
    <title>CRUD Dashboard — Flask + Supabase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">
        <div class="top-bar">
            <div class="brand">
                <span class="brand-icon">⚡</span>
                <h1>CRUD Dashboard</h1>
            </div>
            <button class="toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle light/dark mode">
                🌓 Theme
            </button>
        </div>

        <p class="subtitle">Full Stack Flask + Supabase PostgreSQL</p>

        <div class="input-box">
            <input
                type="text"
                id="name"
                placeholder="Enter item name…"
                maxlength="255"
                autocomplete="off"
                onkeydown="if(event.key==='Enter') addItem()"
            >
            <button class="add-btn" id="addItemBtn" onclick="addItem()" title="Add item">
                ➕ Add
            </button>
        </div>

        <div id="items">
            <div class="empty-message">
                <span class="spinner"></span> Loading items…
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
