services:
  - type: web
    name: flask-crud-supabase
    runtime: python
    region: oregon        # Change to your preferred region
    plan: free            # Upgrade to starter for always-on
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 --timeout 120 --log-level info -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py
      - key: SUPABASE_DB_URL
        sync: false           # Set manually in Render dashboard — never commit secrets!
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value
      - key: LOG_LEVEL
        value: INFO
